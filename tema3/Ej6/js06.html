<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1 class="quote" id="quote">"The only thing we have to fear is fear itself."</h1>

        <div class="controls">
            <button class="new-quote-btn" id="new-quote">New Quote</button>
        </div>
    </main>
    <script src="js06.js"></script>
</body>
</html>
