<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJ11</title>
    <style>
    /* Barra de navegación */
    ul.navbar {
      list-style-type: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #333;
      display: flex;
      justify-content: center;
    }
    ul.navbar li {
      float: left;
    }
    ul.navbar li a {
      display: block;
      color: white;
      text-align: center;
      padding: 16px 24px;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    ul.navbar li a:hover {
      background-color: #111;
    }

    /* Galería de imágenes */
    .gallery-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin: 32px auto;
      max-width: 1000px;
    }
    .gallery {
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 220px;
      background: #fafafa;
      overflow: hidden;
      transition: box-shadow 0.3s;
    }
    .gallery:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      border-color: #777;
    }
    .gallery img {
      width: 100%;
      height: auto;
      display: block;
    }
    .desc {
      padding: 12px;
      text-align: center;
      font-size: 1em;
      color: #333;
    }

    /* Responsive: barra de navegación y galería */
    @media (max-width: 700px) {
      .gallery-container {
        flex-direction: column;
        align-items: center;
      }
      .gallery {
        width: 90%;
        max-width: 350px;
      }
      ul.navbar {
        flex-direction: column;
      }
      ul.navbar li a {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
    <ul class="navbar">
    <li><a href="#">Inicio</a></li>
    <li><a href="#">Galería</a></li>
    <li><a href="#">Contacto</a></li>
  </ul>

  <div class="gallery-container">
    <div class="gallery">
      <a target="_blank" href="https://www.w3schools.com/css/img_5terre.jpg">
        <img src="https://www.w3schools.com/css/img_5terre.jpg" alt="Cinque Terre">
      </a>
      <div class="desc">Cinque Terre</div>
    </div>
    <div class="gallery">
      <a target="_blank" href="https://www.w3schools.com/css/img_forest.jpg">
        <img src="https://www.w3schools.com/css/img_forest.jpg" alt="Forest">
      </a>
      <div class="desc">Bosque</div>
    </div>
    <div class="gallery">
      <a target="_blank" href="https://www.w3schools.com/css/img_lights.jpg">
        <img src="https://www.w3schools.com/css/img_lights.jpg" alt="Northern Lights">
      </a>
      <div class="desc">Auroras boreales</div>
    </div>
    <div class="gallery">
      <a target="_blank" href="https://www.w3schools.com/css/img_mountains.jpg">
        <img src="https://www.w3schools.com/css/img_mountains.jpg" alt="Mountains">
      </a>
      <div class="desc">Montañas</div>
    </div>
  </div>
</body>
</html>
