<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJ6</title>
    <style>
table {
  border-collapse: collapse;
  margin: 0;
  font-family: Arial, sans-serif;
  min-width: 400px;
  box-shadow: 2px 2px 8px #ccc;
}
th, td {
  border: 1px solid #888;
  padding: 8px 16px;
  text-align: center;
}
th {
  background-color: #666;
  color: #fff;
  font-weight: bold;
}
td.name {
  text-align: left;
  background-color: #fff;
  color: #222;
}
td.color-cell {
  color: #fff;
  font-weight: bold;
}
.code-row td {
  background-color: #eee;
  color: #444;
  font-family: 'Courier New', Courier, monospace;
  text-align: left;
  border-top: none;
  font-size: 0.98em;
  padding: 10px 8px;
}
    </style>
</head>
<body>
    <table>
  <tr>
    <th>Name</th>
    <th>Red</th>
    <th>Green</th>
    <th>Blue</th>
  </tr>
  <tr>
    <td class="name">Light Sand</td>
    <td class="color-cell" style="background-color: rgb(255,0,0);">254</td>
    <td class="color-cell" style="background-color: rgb(0,255,0);">255</td>
    <td class="color-cell" style="background-color: rgb(0,0,255);">239</td>
  </tr>
  <tr>
    <td class="name">Beige</td>
    <td class="color-cell" style="background-color: rgb(255,0,0);">245</td>
    <td class="color-cell" style="background-color: rgb(0,255,0);">245</td>
    <td class="color-cell" style="background-color: rgb(0,0,255);">220</td>
  </tr>
  <tr>
    <td class="name">Chocolate</td>
    <td class="color-cell" style="background-color: rgb(255,0,0);">210</td>
    <td class="color-cell" style="background-color: rgb(0,255,0);">105</td>
    <td class="color-cell" style="background-color: rgb(0,0,255);">30</td>
  </tr>
  <tr>
    <td class="name">Gray</td>
    <td class="color-cell" style="background-color: rgb(255,0,0);">190</td>
    <td class="color-cell" style="background-color: rgb(0,255,0);">190</td>
    <td class="color-cell" style="background-color: rgb(0,0,255);">190</td>
  </tr>
  <tr class="code-row">
    <td colspan="4">Use like this: color: rgb(RED, GREEN, BLUE);</td>
  </tr>
</table>
  </tr>
</table>
</body>
</html>
