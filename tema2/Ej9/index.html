<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>EJ9</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 20px;
    }
    h2 {
      margin-top: 40px;
      color: #003366;
    }
    .contenedor {
      position: relative;
      width: 500px;
      height: 300px;
      border: 2px solid #888;
      background: #eee;
      margin-bottom: 40px;
      box-shadow: 2px 2px 10px #ccc;
    }
    .elemento {
      position: absolute;
      font-weight: bold;
      font-size: 2em;
      color: #222;
      text-align: center;
      border-radius: 8px;
      box-shadow: 1px 1px 5px #bbb;
      border: 1px solid #888;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Ejercicio 1 */
    #e1-1 { background: red;    left: 20px;  top: 20px;   width: 100px; height: 50px;}
    #e1-2 { background: blue;   left: 380px; top: 230px;  width: 100px; height: 50px; color: #fff;}
    #e1-3 { background: green;  left: 20px;  top: 180px;  width: 100px; height: 50px;}
    #e1-4 { background: yellow; left: 330px; top: 50px;   width: 100px; height: 50px;}
    /* Ejercicio 2 */
    #e2-1 { background: green;  left: 0px;   top: 0px;    width: 100px; height: 100px;}
    #e2-2 { background: yellow; left: 400px; top: 200px;  width: 100px; height: 100px;}
    #e2-3 { background: red;    left: 0px;   top: 200px;  width: 400px; height: 100px;}
    #e2-4 { background: blue;   left: 400px; top: 0px;    width: 100px; height: 200px; color: #fff;}
    /* Ejercicio 3 */
    #e3-1 { background: red;    left: 0px;   top: 0px;    width: 200px; height: 100px;}
    #e3-2 { background: green;  left: 300px; top: 0px;    width: 200px; height: 100px;}
    #e3-3 { background: yellow; left: 0px;   top: 200px;  width: 200px; height: 100px;}
    #e3-4 { background: blue;   left: 300px; top: 200px;  width: 200px; height: 100px; color: #fff;}
    /* Ejercicio 4 */
    #e4-1 { background: yellow; left: 200px; top: 0px;    width: 100px; height: 100px;}
    #e4-2 { background: blue;   left: 0px;   top: 100px;  width: 100px; height: 100px; color: #fff;}
    #e4-3 { background: green;  left: 400px; top: 100px;  width: 100px; height: 100px;}
    #e4-4 { background: red;    left: 200px; top: 200px;  width: 100px; height: 100px;}
  </style>
</head>
<body>
  <h2>Ejercicio 1</h2>
  <div class="contenedor">
    <div class="elemento" id="e1-1">1</div>
    <div class="elemento" id="e1-2">2</div>
    <div class="elemento" id="e1-3">3</div>
    <div class="elemento" id="e1-4">4</div>
  </div>

  <h2>Ejercicio 2</h2>
  <div class="contenedor">
    <div class="elemento" id="e2-1">1</div>
    <div class="elemento" id="e2-2">2</div>
    <div class="elemento" id="e2-3">3</div>
    <div class="elemento" id="e2-4">4</div>
  </div>

  <h2>Ejercicio 3</h2>
  <div class="contenedor">
    <div class="elemento" id="e3-1">1</div>
    <div class="elemento" id="e3-2">2</div>
    <div class="elemento" id="e3-3">3</div>
    <div class="elemento" id="e3-4">4</div>
  </div>

  <h2>Ejercicio 4</h2>
  <div class="contenedor">
    <div class="elemento" id="e4-1">1</div>
    <div class="elemento" id="e4-2">2</div>
    <div class="elemento" id="e4-3">3</div>
    <div class="elemento" id="e4-4">4</div>
  </div>
</body>
</html>
